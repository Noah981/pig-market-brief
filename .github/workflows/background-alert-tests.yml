name: Background notification regression tests
on:
  pull_request:
    branches: [main]
    paths: ['flutter_app/lib/services/**', 'flutter_app/test/*notification*', '.github/workflows/background-alert-tests.yml', 'scripts/*push*']
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Prepare existing platform and assets
        working-directory: flutter_app
        run: |
          flutter create --platforms=android,ios .
          python ../scripts/configure_flutter_platform.py
          python ../scripts/configure_firebase.py
          rm -f test/widget_test.dart
      - name: Verify nationwide server selection and retry state
        run: python -m unittest scripts.test_official_push
      - name: Verify headless delivery and price deduplication
        working-directory: flutter_app
        run: flutter test test/market_notification_test.dart test/disease_notification_test.dart
      - name: Validate configured FCM sending authorization without delivery
        env:
          DDH_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.DDH_FCM_SERVICE_ACCOUNT_JSON }}
          DDH_FIREBASE_PROJECT_ID: dondonhae-cd1d7
        run: |
          if [ -z "$DDH_FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo 'FCM_SENDER_NOT_CONNECTED: production delivery still blocked'
            exit 0
          fi
          pip install 'google-auth[requests]>=2.38,<3'
          python scripts/send_official_push.py --validate-connection

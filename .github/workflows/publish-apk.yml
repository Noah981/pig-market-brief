name: Publish Dondonhae APK

on:
  push:
    branches:
      - codex/dondonhae-information-platform
    paths:
      - .github/workflows/publish-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dondonhae-5.0.0-alpha1.apk
          gh release delete dondonhae-v5.0.0-alpha1 --cleanup-tag --yes || true
          gh release create dondonhae-v5.0.0-alpha1 dondonhae-5.0.0-alpha1.apk --target "${{ github.sha }}" --title "돈돈해 5.0.0 alpha 1" --notes "돈돈해 Android 설치용 공개 테스트 APK입니다."

name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pig-market-brief-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish permanent latest APK
        working-directory: .
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/todaypig-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/downloads
          cp /tmp/todaypig-latest.apk docs/downloads/todaypig-latest.apk
          git add -f docs/downloads/todaypig-latest.apk
          git diff --cached --quiet || git commit -m "Publish latest Android APK"
          git push origin HEAD:main

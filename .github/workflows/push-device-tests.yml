name: Android terminated-app push verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/push-device-tests.yml', 'scripts/verify_android_push_device.py']
  pull_request:
    paths:
      - .github/workflows/push-device-tests.yml
      - scripts/verify_android_push_device.py
  workflow_dispatch:
  workflow_run:
    workflows: ['Flutter UI build']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  device:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'google-auth[requests]'
      - uses: actions/download-artifact@v4
        with:
          name: dondonhae-flutter-ui-validation
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '37911724968' }}
          github-token: ${{ github.token }}
          path: qa-apk
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DDH_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.DDH_FCM_SERVICE_ACCOUNT_JSON }}
          DDH_FIREBASE_PROJECT_ID: dondonhae-cd1d7
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python scripts/verify_android_push_device.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminated-app-push-evidence
          path: qa-output

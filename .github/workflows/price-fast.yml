name: Fast KAPE price watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_pig_price.py', '.github/workflows/price-fast.yml']
  schedule:
    # 평일 KST 17:30~19:45, 15분 간격으로 신규 확정값을 확인한다.
    - cron: '30,45 8-10 * * 1-5'
    - cron: '0,15 9-10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: fast-kape-price
  cancel-in-progress: true
jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KAPE pig auction price
        env:
          KAPE_SERVICE_KEY: ${{ secrets.KAPE_SERVICE_KEY }}
        run: python scripts/fetch_pig_price.py
      - name: Commit price data safely
        run: |
          mkdir -p /tmp/price-data
          cp docs/data/pig-price.json docs/data/pig-price-history.json docs/data/pig-grade-detail.json /tmp/price-data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/price-data/* docs/data/
          git add docs/data/pig-price.json docs/data/pig-price-history.json docs/data/pig-grade-detail.json
          git diff --cached --quiet || git commit -m "Update KAPE price"
          git push origin HEAD:main

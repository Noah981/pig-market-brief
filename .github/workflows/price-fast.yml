name: Fast KAPE price watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_pig_price.py', '.github/workflows/price-fast.yml']
  schedule:
    # 야간·주말 포함 5분 간격으로 공식 신규 발표와 정정을 확인한다.
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: fast-kape-price
  cancel-in-progress: true
jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KAPE pig auction price
        run: |
          python -m unittest scripts/test_fetch_pig_price.py
          python scripts/fetch_pig_price.py
      - name: Commit price data safely
        run: |
          mkdir -p /tmp/price-data
          cp docs/data/pig-price.json docs/data/pig-price-history.json /tmp/price-data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python scripts/merge_generated_data.py /tmp/price-data docs/data
          git add docs/data/pig-price.json docs/data/pig-price-history.json
          git diff --cached --quiet || git commit -m "Update KAPE price"
          git push origin HEAD:main

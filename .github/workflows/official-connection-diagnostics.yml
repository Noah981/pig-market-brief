name: Official connection diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/official-connection-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose transport without exposing credentials
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: |
          python3 -u - <<'PY'
          import os,json,urllib.parse,urllib.request,subprocess,concurrent.futures,datetime
          day=(datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(days=4)).strftime('%Y%m%d')
          endpoints=[
            ('ECOS','https://ecos.bok.or.kr/api/StatisticSearch/'+urllib.parse.quote(os.environ['ECOS_API_KEY'],safe='')+'/json/kr/1/1/731Y001/D/'+day+'/'+day+'/0000001'),
            ('MAFRA','http://211.237.50.150:7080/openapi/'+urllib.parse.quote(os.environ['MAFRA_API_KEY'],safe='')+'/json/Grid_20151204000000000316_1/1/5'),
            ('MAFRA_XML','http://211.237.50.150:7080/openapi/'+urllib.parse.quote(os.environ['MAFRA_API_KEY'],safe='')+'/xml/Grid_20151204000000000316_1/1/5'),
            ('MAFRA_SAMPLE','http://211.237.50.150:7080/openapi/sample/json/Grid_20151204000000000316_1/1/5'),
            ('MAFRA_HTTP10','http://211.237.50.150:7080/openapi/sample/json/Grid_20151204000000000316_1/1/5'),
            ('FMD','https://www.mafra.go.kr/FMD-AI2/2216/subview.do'),
            ('KAHIS','https://home.kahis.go.kr/home/lkntscrinfo/selectLkntsOccrrnc.do')]
          def check(item):
            name,url=item
            row={'name':name}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'dondonhae-ci/1.0'})
              with urllib.request.urlopen(req,timeout=10) as response:
                body=response.read();row.update(python_status=response.status,bytes=len(body))
            except Exception as error:
              reason=getattr(error,'reason',error)
              row.update(python_error=type(error).__name__,reason_type=type(reason).__name__,errno=getattr(reason,'errno',None))
            try:
              command=['curl','--silent','--show-error','--location','--http1.1','--connect-timeout','10','--max-time','15','--output','/tmp/'+name+'-diagnostic-response','--write-out','%{http_code} %{time_connect} %{time_appconnect} %{time_starttransfer}','--user-agent','dondonhae-ci/1.0',url]
              if name=='MAFRA_HTTP10':command[command.index('--http1.1')]='--http1.0'
              result=subprocess.run(command,capture_output=True,timeout=20)
              row['curl_exit']=result.returncode
              metrics=result.stdout.decode().strip()
              import re
              if re.fullmatch(r'[0-9. ]+',metrics):row['http_connect_tls_firstbyte']=metrics
              stderr=result.stderr.decode('utf-8','ignore')
              row['curl_error_kind']=next((tag for text,tag in [('SSL certificate','certificate'),('Could not resolve','dns'),('Failed to connect','connect'),('timed out','timeout'),('SSL connect','tls-handshake')] if text.lower() in stderr.lower()),'none-or-other')
            except Exception as error:row['curl_exception']=type(error).__name__
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            for row in pool.map(check,endpoints):print(json.dumps(row),flush=True)
          PY

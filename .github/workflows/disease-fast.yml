name: Fast disease signal watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_disease_alerts.py', 'scripts/disease_supplementary.py', '.github/workflows/disease-fast.yml']
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: fast-disease-watch
  cancel-in-progress: true
jobs:
  disease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect suspected, confirmed and negative signals
        env:
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: |
          python -m unittest scripts.test_disease_classifier scripts.test_disease_supplementary
          python -u scripts/fetch_disease_alerts.py --require-verified
      - name: Publish changed disease feed
        run: |
          mkdir -p /tmp/disease-publish
          cp docs/data/disease-alerts.json /tmp/disease-publish/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python scripts/merge_generated_data.py /tmp/disease-publish docs/data
          git add docs/data/disease-alerts.json
          git diff --cached --quiet || git commit -m 'Update disease signals'
          git push origin HEAD:main

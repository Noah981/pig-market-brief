name: Nationwide FCM push alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: dondonhae-fcm-push
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Firebase authentication
        run: pip install google-auth==2.38.0 requests==2.32.3
      - name: Deliver newly published official alerts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/send_fcm_alerts.py
      - name: Persist deduplication baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/push-alert-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update delivered push alert state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Flutter UI build
on:
  workflow_dispatch:
  push:
    branches: [codex/dondonhae-information-platform]
    paths: ['flutter_app/**', '.github/workflows/flutter-build.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generate platform files
        working-directory: flutter_app
        run: |
          flutter create --platforms=android,ios .
          rm -f test/widget_test.dart
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Render 360, 390, 412 screenshots
        working-directory: flutter_app
        run: flutter test --update-goldens test/layout_test.dart
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dondonhae-flutter-ui-validation
          path: |
            flutter_app/test/goldens/*.png
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish verified APK and screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk dondonhae-flutter-1.1.0.apk
          cp flutter_app/test/goldens/home_390.png dondonhae-home-390.png
          gh release delete dondonhae-flutter-v1.1.0 --cleanup-tag --yes || true
          gh release create dondonhae-flutter-v1.1.0 dondonhae-flutter-1.1.0.apk dondonhae-home-390.png --target "${{ github.sha }}" --title "돈돈해 Flutter 1.1.0" --notes "최종 동결 시안 기반 UI. 360/390/412dp 오버플로 검사와 5탭 이동 검증 완료."

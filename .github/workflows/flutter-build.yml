name: Flutter UI build # official API release gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/flutter-build.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generate platform files
        working-directory: flutter_app
        run: |
          flutter create --platforms=android,ios .
          python ../scripts/configure_flutter_platform.py
          dart run flutter_launcher_icons
          rm -f test/widget_test.dart
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Verify official API connectivity
        if: github.event_name != 'pull_request'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KAPE_API_KEY: ${{ secrets.KAPE_API_KEY || secrets.KAPE_SERVICE_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY || secrets.KMA_SERVICE_KEY }}
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: python scripts/validate_official_apis.py
      - name: Render 360, 390, 412 screenshots
        working-directory: flutter_app
        run: |
          flutter test test/market_repository_test.dart
          flutter test test/commodity_repository_test.dart
          flutter test test/disease_repository_test.dart
          flutter test test/weather_farm_repository_test.dart
          flutter test test/official_api_clients_test.dart
          flutter test --update-goldens test/layout_test.dart
      - name: Build release APK
        working-directory: flutter_app
        run: >-
          flutter build apk --release
          --dart-define=ECOS_API_KEY=${{ secrets.ECOS_API_KEY }}
          --dart-define=KAPE_API_KEY=${{ secrets.KAPE_API_KEY || secrets.KAPE_SERVICE_KEY }}
          --dart-define=KMA_API_KEY=${{ secrets.KMA_API_KEY || secrets.KMA_SERVICE_KEY }}
          --dart-define=MAFRA_API_KEY=${{ secrets.MAFRA_API_KEY }}
      - name: Verify release network permission
        working-directory: flutter_app
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -q 'android.permission.INTERNET'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dondonhae-flutter-ui-validation
          path: |
            flutter_app/test/goldens/*.png
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish verified APK and screenshots
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk dondonhae-WORK4-release.apk
          cp flutter_app/test/goldens/home_390.png dondonhae-home-390.png
          gh release delete dondonhae-work4 --cleanup-tag --yes || true
          gh release create dondonhae-work4 dondonhae-WORK4-release.apk dondonhae-home-390.png --target "${{ github.sha }}" --title "돈돈해 WORK 4" --notes "공식 API 5종, 캐시 우선 표시, 수동·자동·백그라운드 갱신을 적용한 검증 빌드입니다."

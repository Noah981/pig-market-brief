name: Flutter UI build # strict Dabom release gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/flutter-build.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Prepare persistent production signing
        id: release_signing
        if: github.event_name != 'pull_request'
        env:
          DDH_ANDROID_KEYSTORE_B64: ${{ secrets.DDH_ANDROID_KEYSTORE_B64 }}
          DDH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DDH_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY_SIGNING'
          import os,base64,pathlib
          ready=bool(os.environ.get('DDH_ANDROID_KEYSTORE_B64')) and bool(os.environ.get('DDH_ANDROID_KEYSTORE_PASSWORD'))
          if ready:
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'dondonhae-release.p12'
              path.write_bytes(base64.b64decode(os.environ['DDH_ANDROID_KEYSTORE_B64'],validate=True))
              path.chmod(0o600)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('production='+str(ready).lower()+'\n')
          print('Persistent production signer available' if ready else 'Test-signed validation APK only; production publication disabled')
          PY_SIGNING
      - name: Generate platform files
        env:
          DDH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dondonhae-release.p12
          DDH_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DDH_ANDROID_KEYSTORE_PASSWORD || '' }}
        working-directory: flutter_app
        run: |
          flutter create --platforms=android,ios .
          python ../scripts/configure_flutter_platform.py
          python ../scripts/configure_firebase.py --require
          python ../scripts/configure_play_release.py
          python ../scripts/configure_android_release_signing.py
          dart run flutter_launcher_icons
          rm -f test/widget_test.dart
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Prepare public official inputs for native widget QA
        run: python scripts/prepare_widget_preview.py
      - name: Render actual Android RemoteViews widget
        working-directory: flutter_app/android
        run: ./gradlew :app:testDebugUnitTest --tests com.example.dondonhae.PriceCardArtworkTest --tests com.example.dondonhae.PriceRefreshWorkerTest --tests com.example.dondonhae.WeatherCacheTest --tests com.example.dondonhae.NativeGradeRefreshTest
      - name: Use the four verified native widget previews
        run: |
          for kind in small medium large today; do
            cp "flutter_app/android/app/build/widget-screenshots/four_${kind}_fixture.png" "flutter_app/android/app/src/main/res/drawable/widget_${kind}_preview.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dondonhae-four-widgets-native
          path: flutter_app/android/app/build/widget-screenshots/*.png
      - name: Verify official API connectivity
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KAPE_API_KEY: ${{ secrets.KAPE_API_KEY || secrets.KAPE_SERVICE_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY || secrets.KMA_SERVICE_KEY }}
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python scripts/validate_official_apis.py && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Official API check failed transiently; retrying ($attempt/3)"
            sleep $((attempt * 10))
          done
      - name: Require live Dabom grade and auction rows
        run: python scripts/validate_official_apis.py --dabom-only
      - name: Install official market workbook readers
        run: pip install openpyxl==3.1.5 xlrd==2.0.1
      - name: Bundle verified disease records
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: |
          python -m unittest scripts.test_generated_data_merge scripts.test_disease_classifier scripts.test_disease_supplementary scripts.test_kahis_occurrences scripts.test_android_release_signing scripts.test_weather_data
          PYTHONPATH=scripts python -m unittest scripts/test_platform.py
          python scripts/fetch_disease_alerts.py
          python -c "import json; data=json.load(open('docs/data/disease-alerts.json')); assert data.get('coverageVerified') is True and data.get('asfDisclosureVerified') is True and data.get('fmdDisclosureVerified') is True and data.get('pedStatisticsVerified') is True, 'Official disease coverage not verified; release blocked'"
          cp docs/data/disease-alerts.json flutter_app/assets/data/disease-alerts.json
          python scripts/fetch_fred_markets.py
          python -c "import json; d=json.load(open('docs/data/platform.json')); rows=d.get('markets',[]); assert len(rows)==6 and all(x.get('status')=='LIVE' for x in rows), 'Six official market series are not currently verified; release blocked'; print('All six market series verified')"
          python scripts/fetch_official_benefits.py
          python -c "import json; d=json.load(open('docs/data/platform.json')); print('Notice source states:',json.dumps(d.get('sourceStatus',[]),ensure_ascii=False))"
          cp docs/data/platform.json flutter_app/assets/data/platform.json
      - name: Render 360, 390, 412 screenshots
        working-directory: flutter_app
        run: |
          flutter test test/display_refresh_test.dart
          flutter test test/market_repository_test.dart
          flutter test test/commodity_repository_test.dart
          flutter test test/disease_repository_test.dart
          flutter test test/korean_location_resolver_test.dart
          flutter test test/disease_notification_test.dart
          flutter test test/market_notification_test.dart
          flutter test test/weather_farm_repository_test.dart
          flutter test test/official_api_clients_test.dart
          flutter test test/live_market_driver_builder_test.dart
          flutter test --update-goldens test/layout_test.dart
      - name: Build release APK
        env:
          DDH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dondonhae-release.p12
          DDH_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DDH_ANDROID_KEYSTORE_PASSWORD || '' }}
        working-directory: flutter_app
        run: >-
          flutter build apk --release
          --dart-define=ECOS_API_KEY=${{ secrets.ECOS_API_KEY }}
          --dart-define=KAPE_API_KEY=${{ secrets.KAPE_API_KEY || secrets.KAPE_SERVICE_KEY }}
          --dart-define=KMA_API_KEY=${{ secrets.KMA_API_KEY || secrets.KMA_SERVICE_KEY }}
          --dart-define=MAFRA_API_KEY=${{ secrets.MAFRA_API_KEY }}
      - name: Build Android 16 upload bundle with configured Firebase
        working-directory: flutter_app
        run: >
          flutter build appbundle --release
          --dart-define=ECOS_API_KEY=${{ secrets.ECOS_API_KEY }}
          --dart-define=KAPE_API_KEY=${{ secrets.KAPE_API_KEY || secrets.KAPE_SERVICE_KEY }}
          --dart-define=KMA_API_KEY=${{ secrets.KMA_API_KEY || secrets.KMA_SERVICE_KEY }}
          --dart-define=MAFRA_API_KEY=${{ secrets.MAFRA_API_KEY }}
      - name: Verify release network permission
        working-directory: flutter_app
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -q 'android.permission.INTERNET'
          WIDGETS="$($AAPT dump xmltree build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml)"
          for provider in PigPriceSmallWidget PigPriceDetailWidget PigGradeWidget TodayOverviewWidget; do
            grep -q "$provider" <<< "$WIDGETS"
          done
          grep -q 'dondonhae' <<< "$WIDGETS"
      - name: Verify persistent release certificate
        if: steps.release_signing.outputs.production == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs flutter_app/build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/dondonhae-cert.txt"
          python3 - <<'PY_CERT'
          import json,os,pathlib,re
          expected=json.loads(pathlib.Path('flutter_app/android_widget/release-certificate.json').read_text())['sha256']
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'dondonhae-cert.txt').read_text()
          actual=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',text)
          if actual is None or actual[1]!=expected:raise SystemExit('Production certificate mismatch; publication blocked')
          print('Persistent release certificate verified')
          PY_CERT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dondonhae-flutter-ui-validation
          path: |
            flutter_app/test/goldens/*.png
            flutter_app/android/app/build/widget-screenshots/*.png
            flutter_app/android/app/build/reports/tests/testDebugUnitTest/**
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
      - name: Publish verified APK and screenshots
        if: github.event_name != 'pull_request' && steps.release_signing.outputs.production == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk dondonhae-final-ui-release.apk
          cp flutter_app/test/goldens/home_390.png dondonhae-home-390.png
          cp flutter_app/test/goldens/market_390.png dondonhae-market-390.png
          mkdir -p visual-screenshots
          cp flutter_app/test/goldens/*.png visual-screenshots/
          cp flutter_app/android/app/build/widget-screenshots/*.png visual-screenshots/
          zip -r dondonhae-visual-screenshots.zip visual-screenshots
          gh release view dondonhae-final-ui >/dev/null 2>&1 || gh release create dondonhae-final-ui --target "${{ github.sha }}" --title "돈돈해 Android 배포판" --notes "공식 데이터와 고정 배포 서명 검증을 통과한 APK입니다."
          gh release upload dondonhae-final-ui dondonhae-final-ui-release.apk dondonhae-home-390.png dondonhae-market-390.png dondonhae-visual-screenshots.zip --clobber

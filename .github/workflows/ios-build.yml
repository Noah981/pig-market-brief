name: iOS app and price widget validation
on:
  pull_request:
    branches: [main]
    paths: ['flutter_app/**', 'scripts/configure_ios_widgets.rb', '.github/workflows/ios-build.yml']
  push:
    branches: [main]
    paths: ['flutter_app/ios_widget/**', 'scripts/configure_ios_widgets.rb', '.github/workflows/ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Prepare existing iOS app and WidgetKit extension
        working-directory: flutter_app
        run: |
          flutter create --platforms=ios .
          flutter pub get
          ruby ../scripts/configure_ios_widgets.rb
          dart run flutter_launcher_icons
          cd ios
          pod install
      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze
      - name: Build iPhone app with embedded widget, without signing
        working-directory: flutter_app
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=ECOS_API_KEY=${{ secrets.ECOS_API_KEY }}
          --dart-define=KAPE_API_KEY=${{ secrets.KAPE_API_KEY || secrets.KAPE_SERVICE_KEY }}
          --dart-define=KMA_API_KEY=${{ secrets.KMA_API_KEY || secrets.KMA_SERVICE_KEY }}
          --dart-define=MAFRA_API_KEY=${{ secrets.MAFRA_API_KEY }}
      - name: Build native widget verification app
        working-directory: flutter_app/ios
        run: xcodebuild -project Runner.xcodeproj -scheme WidgetPreview -sdk iphonesimulator -configuration Debug -derivedDataPath ../build/widget-preview CODE_SIGNING_ALLOWED=NO build
      - name: Render and check home and lock screen layouts
        working-directory: flutter_app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/widget-preview/Build/Products/Debug-iphonesimulator/WidgetPreview.app
          xcrun simctl launch "$DEVICE" com.example.dondonhae.WidgetPreview
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.example.dondonhae.WidgetPreview data)
          for attempt in $(seq 1 20); do
            if [ -f "$CONTAINER/Documents/verified.txt" ]; then break; fi
            sleep 1
          done
          test -f "$CONTAINER/Documents/verified.txt"
          mkdir -p build/widget-screenshots
          cp "$CONTAINER"/Documents/*.png build/widget-screenshots/
          cp "$CONTAINER/Documents/verified.txt" build/widget-screenshots/
      - name: Package unsigned iOS build honestly
        working-directory: flutter_app
        run: |
          test -d build/ios/iphoneos/Runner.app/PlugIns/PigPriceWidgets.appex
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/dondonhae-ios-unsigned-app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dondonhae-ios-widget-validation
          path: |
            flutter_app/build/dondonhae-ios-unsigned-app.zip
            flutter_app/build/widget-screenshots/*

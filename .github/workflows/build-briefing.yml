name: Build pig briefing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-briefing.yml"
  schedule:
    # 전체 브리핑은 시간당 갱신. 돈가 발표 감시는 price-fast.yml에서 분리 수행.
    - cron: "7 * * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KMA weather
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_weather.py || echo "Weather fetch failed; keeping previous cached data"
      - name: Fetch KAPE national ex-Jeju pig auction price
        env:
          KAPE_SERVICE_KEY: ${{ secrets.KAPE_SERVICE_KEY }}
        run: python scripts/fetch_pig_price.py
      - name: Fetch KAPE Jeju pig prices
        env:
          KAPE_SERVICE_KEY: ${{ secrets.KAPE_SERVICE_KEY }}
        run: python scripts/fetch_kape_jeju.py || echo "Jeju fetch failed; keeping previous cached data"
      - name: Build briefing
        run: python scripts/build_briefing.py
      - name: Build market analysis
        run: python scripts/build_market_analysis.py
      - name: Fetch official livestock disease alerts
        run: python scripts/fetch_disease_alerts.py || echo "Disease feed failed; keeping previous data"
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "Update briefing data"
          git pull --rebase origin main
          git push origin HEAD:main

name: Build pig briefing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-briefing.yml"
  schedule:
    # 전체 브리핑은 시간당 갱신. 돈가 발표 감시는 price-fast.yml에서 분리 수행.
    - cron: "7 * * * *"
permissions:
  contents: write
concurrency:
  group: briefing-data-writer
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KMA weather
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_API_KEY || secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_weather.py || echo "Weather fetch failed; keeping previous cached data"
      # 대표 돈가는 축산유통정보 다봄의 '생산자 돼지 경락가격' 공표값만
      # 사용한다. pigGrade 원자료 자체 가중평균 수집기는 다른 값이므로 호출하지 않는다.
      - name: Fetch KAPE Jeju pig prices
        env:
          KAPE_SERVICE_KEY: ${{ secrets.KAPE_SERVICE_KEY }}
        run: python scripts/fetch_kape_jeju.py || echo "Jeju fetch failed; keeping previous cached data"
      - name: Update verified market and benefits adapters
        run: python scripts/platform_pipeline.py
      - name: Collect official livestock support notices
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY || secrets.BIZINFO_SUPPORT_PROGRAM_API }}
          BIZINFO_CANONICAL_CONFIGURED: ${{ secrets.BIZINFO_API_KEY != '' }}
          BIZINFO_LEGACY_CONFIGURED: ${{ secrets.BIZINFO_SUPPORT_PROGRAM_API != '' }}
        run: |
          python - <<'PY_BIZINFO'
          import os
          for name, marker in [('BIZINFO_API_KEY', 'BIZINFO_CANONICAL_CONFIGURED'), ('BIZINFO_SUPPORT_PROGRAM_API', 'BIZINFO_LEGACY_CONFIGURED')]:
              print(name + ' configured: ' + str(os.getenv(marker, '').lower() == 'true'))
          PY_BIZINFO
          python scripts/fetch_official_benefits.py || echo "Benefit fetch failed; keeping previous cached data"
      # Independent market-fast.yml publishes these observations every 15 min.
      # This longer weather/disease job must not overwrite its connection state.
      - name: Build briefing
        run: python scripts/build_briefing.py
      - name: Build market analysis
        run: python scripts/build_market_analysis.py
      - name: Fetch official livestock disease alerts
        env:
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: |
          python -m unittest scripts/test_disease_classifier.py
          cp docs/data/disease-alerts.json /tmp/previous-disease-alerts.json
          if ! python -u scripts/fetch_disease_alerts.py --require-verified; then
            cp /tmp/previous-disease-alerts.json docs/data/disease-alerts.json
            echo "Disease coverage fetch failed; retained the original data and original verification timestamp"
          fi
      - name: Commit generated data safely
        run: |
          cp -R docs/data /tmp/generated-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_generated_data.py /tmp/generated-data docs/data
            git add docs/data/
            git diff --cached --quiet || git commit -m "Update briefing data"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Concurrent publication did not complete after retries"
          exit 1

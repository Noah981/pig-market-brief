name: Build daily pig briefing
on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_briefing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/briefing.json
          git diff --cached --quiet || git commit -m "Update daily briefing"
          git push

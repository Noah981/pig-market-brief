name: Build pig briefing
# trigger-refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"\n    - cron: "20 10 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KMA weather
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_weather.py
      - name: Fetch KAPE national representative pig price\n        env:\n          KAPE_SERVICE_KEY: ${{ secrets.KAPE_SERVICE_KEY }}\n        run: python scripts/fetch_pig_price.py\n      - name: Fetch KAPE Jeju pig prices
        env:
          KAPE_SERVICE_KEY: ${{ secrets.KAPE_SERVICE_KEY }}
        run: python scripts/fetch_kape_jeju.py
      - name: Build briefing
        run: python scripts/build_briefing.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "Update briefing data"
          git push

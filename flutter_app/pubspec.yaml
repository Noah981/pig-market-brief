name: dondonhae
description: 돈돈해 모바일 대시보드
publish_to: none
version: 1.5.0+14
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.2
  http: ^1.2.2
  shared_preferences: ^2.3.5
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/dondonhae_symbol.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/images/dondonhae_symbol.png
flutter:
  uses-material-design: true
  assets:
    - assets/images/pig_hero.jpg
    - assets/data/pig-price.json
    - assets/data/pig-price-history.json
    - assets/data/platform.json
    - assets/data/disease-alerts.json
    - assets/data/korea_provinces.geojson.gz
    - assets/images/dondonhae_symbol.png
